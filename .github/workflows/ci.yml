name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Generate example plans (offline)
        run: storytest generate examples/stories/* -p offline -o out
      - name: Type-check generated Playwright specs
        run: |
          npm init -y >/dev/null
          npm install --silent @playwright/test typescript @types/node
          npx tsc --noEmit --strict --skipLibCheck --types node --module esnext --moduleResolution bundler --target es2022 --lib esnext out/*.spec.ts
